name: MTGemmVP
options:
  bundleIdPrefix: com.michaeltesch
targets:
  MTGemmVP:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: App
      - path: ../src/mtgemm_amx.cpp
      - path: ../src/model.cpp
      - path: ../src/threads.cpp
      - path: ../tests/test_gemm.cpp
        compilerFlags: "-Dmain=test_main"
      - path: ../bench/bench.cpp
        compilerFlags: "-Dmain=bench_main -DACCELERATE_NEW_LAPACK -DMT_BENCH_AMX"
      - path: ../bench/ubench_amx.cpp
        compilerFlags: "-Dmain=ubench_main"
    dependencies:
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaeltesch.mtgemmvp
        DEVELOPMENT_TEAM: 23HDX8RSR7
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: App/bridge.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../include", "$(SRCROOT)/../src"]
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_OPTIMIZATION_LEVEL: "3"
        GCC_PREPROCESSOR_DEFINITIONS: ["NDEBUG=1"]
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: App/MTGemmVP.entitlements
